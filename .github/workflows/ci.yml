# CI for Mini La Centrale.
#
# Two jobs, on purpose:
#   regression -> tests that MUST pass. A red result blocks the merge.
#   bughunt    -> tests that hit known (planted) bugs, plus flaky tests. They are
#                 expected to fail (sometimes or always), so this job may fail
#                 without blocking anything.
#   scale      -> rules checked on thousands of cars (tests/scale), split into 3
#                 jobs running in parallel. Non-blocking: they report bugs.
#   scale-summary -> one table of all rules, on the run's summary page. Its JUnit report
#                 is saved for QA Pilot's AI triage (Phase 4).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    name: Regression tests (must pass)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run regression tests
        run: npm test -- --ci --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: reports
          JEST_JUNIT_OUTPUT_NAME: regression.xml
      - name: Save JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-regression
          path: reports/

  bughunt:
    name: Bug-hunt and flaky tests (allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run bug-hunt tests
        run: npm run test:bughunt -- --ci --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: reports
          JEST_JUNIT_OUTPUT_NAME: bughunt.xml
      - name: Save JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-bughunt
          path: reports/

  qa-pilot-design:
    name: QA Pilot test design (proposals only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Propose test cases for every story
        # Uses Claude when the ANTHROPIC_API_KEY secret exists, otherwise the free rule-based mock.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for story in stories/*.md; do
            npm run qa:design -- "$story"
          done
      - name: Save proposals and the AI action log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-pilot-proposals
          path: reports/qa-pilot/

  scale:
    name: Scale tests ${{ matrix.shard }}/3 (allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run scale tests (quick sample), part ${{ matrix.shard }} of 3
        run: npx jest scale --shard=${{ matrix.shard }}/3 --ci --reporters=default --reporters=jest-junit
        env:
          SCALE: quick
          JEST_JUNIT_OUTPUT_DIR: reports
          JEST_JUNIT_OUTPUT_NAME: scale-${{ matrix.shard }}.xml
          JEST_JUNIT_CLASSNAME: "{classname}"
          JEST_JUNIT_TITLE: "{title}"
      - name: Save JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-scale-${{ matrix.shard }}
          path: reports/

  scale-summary:
    name: Scale tests summary
    needs: scale
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-scale-*
          path: reports
          merge-multiple: true
      - name: One table for all rules
        run: npx tsx scripts/junit-summary.ts reports/scale-*.xml
